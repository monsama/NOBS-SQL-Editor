name: test

# Runs the existing Rust unit/integration test suite (src-tauri/src/main.rs's #[test]s) on every
# push to main and every PR against it, so a regression fails the check instead of only being
# caught by hand-testing later. Tests marked #[ignore] need a live NOBS_TEST_DSN database and are
# skipped here (cargo test's default behavior) - everything else (SQL statement splitting, CSV
# import edge cases, read-only mode enforcement, SQL-literal escaping, etc.) still runs.
#
# Three jobs, run in parallel: `test` (unit tests, clippy, the UI tests), `live` (both servers and
# the GUI scenarios against them) and `tools-download` (the app's own client-tools download, run
# for real against mariadb.org - the one #[ignore]d test that needs no database).
on:
  push:
    branches: [main]
  pull_request: {}
  # Weekly, because two of the jobs below depend on someone else's website keeping its shape:
  # mariadb.org's release API (tools-download) and both vendors' download pages (the servers the
  # live tests run against). Nothing here would notice such a break on its own - no push is
  # needed to cause it - so without a schedule the first report comes from a user whose download
  # button stopped working. Monday morning, and deliberately not on the hour (GitHub delays
  # scheduled runs at popular times). Note GitHub disables scheduled workflows in a repository
  # with no pushes for 60 days, and emails before it does.
  schedule:
    - cron: '17 6 * * 1'
  # So the same checks can be run on demand without pushing anything - and, below, so the slower
  # scheduled-only steps can be triggered by hand.
  workflow_dispatch: {}

jobs:
  test:
    # windows-latest, same as build.yml: this is a Tauri app, so compiling it (even just to run
    # tests) needs the platform's webview stack. Windows ships WebView2 already; avoiding a
    # separate Linux job here means no extra libgtk/libwebkit apt setup to install and maintain.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo.toml lives in src-tauri/, not the repo root - see build.yml's comment on why
          # this needs to be set explicitly.
          workspaces: src-tauri

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      # Clippy is clean, so any warning here is new. A newer stable Rust can add lints too - then
      # this step names them and the fix is usually what clippy itself suggests.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # node --test expands the tests/ui/*.test.mjs glob itself rather than relying on the shell
      # (the CI shell here is PowerShell, which would not), and that needs Node 21+ - so pin it
      # instead of taking whatever the runner image happens to ship.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The grid's sort/filter ordering lives in ui/index.html, which cargo test cannot reach.
      # tests/ui/ extracts those functions from the file itself and exercises them under Node's
      # built-in runner - no dependencies to install, so this needs no npm ci.
      - name: Run UI tests
        run: npm test

  # The #[ignore]d tests need real servers, and they are the ones that have caught real bugs. The
  # setup script downloads MariaDB and MySQL, starts both on this runner (MySQL where a real
  # installation lives, so the app finds MySQL's own client tools there), loads the fixture and
  # puts MariaDB's client tools where the app's own download would. Every push is then checked
  # against both servers, not only on a developer's machine.
  live:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The two archives are ~90 MB and ~270 MB. The versions live in the script, so its hash is
      # the key.
      - name: Cache server downloads
        uses: actions/cache@v6
        with:
          path: C:\nobs-ci\cache
          key: nobs-ci-servers-${{ hashFiles('tests/ci/start-test-servers.ps1') }}

      - name: Start MariaDB and MySQL
        shell: pwsh
        run: ./tests/ci/start-test-servers.ps1

      # The GUI tests drive the built app over the Chrome DevTools protocol; run.mjs needs Node 22+.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the app for the GUI tests
        working-directory: src-tauri
        run: cargo build

      - name: Live tests against MariaDB
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:NOBS_TEST_DSN = $env:NOBS_CI_MARIADB_DSN
          $env:NOBS_TEST_SERVER_CA = $env:NOBS_CI_MARIADB_CA
          cargo test -- --include-ignored --test-threads=1

      - name: Live tests against MySQL
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:NOBS_TEST_DSN = $env:NOBS_CI_MYSQL_DSN
          $env:NOBS_TEST_SERVER_CA = $env:NOBS_CI_MYSQL_CA
          cargo test -- --include-ignored --test-threads=1

      # The real app, driven through its UI: grid edits, Compare, export and import, a script's
      # results. See tests/gui/run.mjs.
      - name: GUI tests against MariaDB
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:NOBS_TEST_DSN = $env:NOBS_CI_MARIADB_DSN
          $env:NOBS_GUI_SCREENSHOT = Join-Path $env:RUNNER_TEMP 'screen.png'
          # Exit 3 means the run never reached a scenario: the window did not open, the browser
          # did not answer, the database did not connect. Nothing was evaluated, so trying again
          # hides nothing - and the line it prints is what makes the frequency countable later.
          # Any other failure is a check that found something and fails the build as it is.
          node tests/gui/run.mjs --app desktop --target src-tauri/target/debug/nobs-sql-editor.exe
          if ($LASTEXITCODE -eq 3) {
            "  the app never started - trying once more (exit 3)"
            node tests/gui/run.mjs --app desktop --target src-tauri/target/debug/nobs-sql-editor.exe
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GUI tests against MySQL
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:NOBS_TEST_DSN = $env:NOBS_CI_MYSQL_DSN
          $env:NOBS_GUI_SCREENSHOT = Join-Path $env:RUNNER_TEMP 'screen.png'
          # Exit 3 means the run never reached a scenario: the window did not open, the browser
          # did not answer, the database did not connect. Nothing was evaluated, so trying again
          # hides nothing - and the line it prints is what makes the frequency countable later.
          # Any other failure is a check that found something and fails the build as it is.
          node tests/gui/run.mjs --app desktop --target src-tauri/target/debug/nobs-sql-editor.exe
          if ($LASTEXITCODE -eq 3) {
            "  the app never started - trying once more (exit 3)"
            node tests/gui/run.mjs --app desktop --target src-tauri/target/debug/nobs-sql-editor.exe
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GUI diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.Name -match 'nobs|webview|msedge' } | Format-Table Name, Id, SessionId -AutoSize | Out-String | Write-Host
          "Session of this step: $((Get-Process -Id $PID).SessionId)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path $env:RUNNER_TEMP 'screen-after.png'))

      - name: Screen at failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gui-screen
          path: ${{ runner.temp }}/screen*.png

      - name: Server logs
        if: ${{ failure() }}
        shell: pwsh
        run: Get-Content C:\nobs-ci\mariadb.err, C:\nobs-ci\mysql.err -Tail 60 -ErrorAction SilentlyContinue

  # The app's own "Download MariaDB client tools" button, run for real against mariadb.org. Neither
  # of the jobs above reaches it: the unit tests cannot (it is a network download) and the GUI
  # scenario only checks that Settings draws the two cards, so until this job existed the whole
  # path - the release API's response shape, the SHA-256 the archive is checked against, and the
  # zip crate reading a genuine 90 MB archive - was covered by a line in the manual test plan. A
  # zip major bump therefore could not break it in CI; it broke it for whoever clicked the button
  # next. Dependabot bumps zip on its own schedule, which is exactly why this runs unattended.
  #
  # Separate job, not a step in `test`: it is the only one that needs the network for anything but
  # crates.io, it takes a couple of minutes, and a failure here means "the download is broken",
  # which should not read as "the unit tests failed". It runs in parallel with them either way.
  tools-download:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The test is #[ignore]d and additionally gated on NOBS_TEST_TOOLS_DOWNLOAD, so that running
      # the ignored tests locally cannot replace a developer's own client tools behind their back.
      # Here the runner is disposable, so the variable is simply set.
      - name: Download, verify and extract the MariaDB client tools
        working-directory: src-tauri
        env:
          NOBS_TEST_TOOLS_DOWNLOAD: '1'
        run: cargo test the_mariadb_client_tools_download -- --ignored --nocapture

      # MySQL's is ~270 MB (the whole server archive, of which two binaries are kept) and its
      # version, file name and MD5 come out of the HTML of dev.mysql.com's download page rather
      # than an API - so it is the more likely of the two to break, and the more expensive to
      # check. On the schedule and on demand, then, not on every push: a restyled page breaks the
      # download for users whether or not anyone pushed that week, which is the case a weekly run
      # covers and a per-PR run would only make slower.
      - name: Download, verify and extract the MySQL client tools
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        working-directory: src-tauri
        env:
          NOBS_TEST_TOOLS_DOWNLOAD: '1'
        run: cargo test the_mysql_client_tools_download -- --ignored --nocapture

      # What it left on disk, when it failed - a truncated archive and a checksum mismatch look
      # the same in the assertion message, but not here.
      - name: What was extracted
        if: ${{ failure() }}
        shell: pwsh
        run: Get-ChildItem -Recurse "$env:APPDATA\NOBSSQL-Desktop\bin" | Select-Object FullName, Length
