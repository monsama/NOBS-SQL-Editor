name: test

# Runs the existing Rust unit/integration test suite (src-tauri/src/main.rs's #[test]s) on every
# push to main and every PR against it, so a regression fails the check instead of only being
# caught by hand-testing later. Tests marked #[ignore] need a live NOBS_TEST_DSN database and are
# skipped here (cargo test's default behavior) - everything else (SQL statement splitting, CSV
# import edge cases, read-only mode enforcement, SQL-literal escaping, etc.) still runs.
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    # windows-latest, same as build.yml: this is a Tauri app, so compiling it (even just to run
    # tests) needs the platform's webview stack. Windows ships WebView2 already; avoiding a
    # separate Linux job here means no extra libgtk/libwebkit apt setup to install and maintain.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo.toml lives in src-tauri/, not the repo root - see build.yml's comment on why
          # this needs to be set explicitly.
          workspaces: src-tauri

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      # node --test expands the tests/ui/*.test.mjs glob itself rather than relying on the shell
      # (the CI shell here is PowerShell, which would not), and that needs Node 21+ - so pin it
      # instead of taking whatever the runner image happens to ship.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The grid's sort/filter ordering lives in ui/index.html, which cargo test cannot reach.
      # tests/ui/ extracts those functions from the file itself and exercises them under Node's
      # built-in runner - no dependencies to install, so this needs no npm ci.
      - name: Run UI tests
        run: npm test
