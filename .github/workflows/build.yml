name: build

on:
  push:
    tags: ["v*"]        # build installers on version tags
  workflow_dispatch: {} # allow manual runs

jobs:
  # Does this tag belong to the code it points at? Tagging an old commit - marking a release that
  # never got a tag, say - otherwise built installers from three-week-old code and left a draft
  # release for it, which is nobody's intention. A mismatch skips the build rather than failing it:
  # there is nothing wrong, the tag simply is not a release of this tree. The reason goes in the run
  # summary, so forgetting to bump the version looks like what it is instead of like silence.
  #
  # Cheap and separate, because the version can only be read after a checkout, and a job-level
  # condition cannot wait for that.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          tree=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          echo "the tree says $tree, this ref is $tag"
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: building." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$tag" = "v$tree" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Tag \`$tag\` matches the version in the tree. Building." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Tag \`$tag\` does not match the version in the tree (\`$tree\`), so no installers were built and no release was drafted." >> "$GITHUB_STEP_SUMMARY"
            echo "If this tag was meant to release this code, bump the version first; if it marks an older commit, nothing is wrong." >> "$GITHUB_STEP_SUMMARY"
          fi

  windows:
    needs: gate
    if: ${{ needs.gate.outputs.build == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write   # required to create the GitHub Release
    env:
      # The `secrets` context is not available in a step-level `if:`, so expose the
      # token as an env var here and test `env.SIGNPATH_API_TOKEN` in the signing
      # steps below. Unset secret -> empty string -> those steps are skipped.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo.toml lives in src-tauri/, not the repo root. Without this the
          # action caches a non-existent target/ dir, finds no Cargo.lock to key
          # on, and errors in post-job cleanup - so nothing is ever cached and
          # every build recompiles all dependencies from scratch.
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci || npm install

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri build

      - name: Upload installers (unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            **/target/release/bundle/nsis/*-setup.exe
            **/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # --- The signing steps, kept but inert. SignPath Foundation declined this project in
      # September 2026 and no certificate is in place (CODE_SIGNING.md), so SIGNPATH_API_TOKEN is
      # unset and every step below is skipped rather than failing the build: a tag produces a
      # normal unsigned build. They are kept because the shape of the work is right for any
      # service that signs a CI artifact, not only SignPath - wiring one up means the token and
      # organization-id (repo Settings > Secrets and variables > Actions), the two slugs below,
      # and nothing else. Releases carry SHA-256 checksums in the meantime; see the step further
      # down, and note it runs after these so it hashes whatever is actually published.

      - name: Upload unsigned NSIS installer for signing
        id: upload-unsigned-nsis
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-nsis
          path: "**/target/release/bundle/nsis/*-setup.exe"

      - name: Sign NSIS installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'nobs-sql-editor'          # replace with your actual SignPath project slug
          signing-policy-slug: 'release-signing'   # replace with your actual SignPath signing policy slug
          github-artifact-id: '${{ steps.upload-unsigned-nsis.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed/nsis

      - name: Upload unsigned MSI installer for signing
        id: upload-unsigned-msi
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-msi
          path: "**/target/release/bundle/msi/*.msi"

      - name: Sign MSI installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'nobs-sql-editor'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-msi.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed/msi

      - name: Upload signed installers
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers-signed
          path: |
            signed/nsis/**
            signed/msi/**
          if-no-files-found: warn

      # --- Checksums. The installers are not code-signed (SignPath Foundation declined in
      # September 2026 - see CODE_SIGNING.md), so this is what a careful user has instead: the
      # SHA-256 of each installer, generated in the same run that built it and published both as
      # a file and in the release notes. It proves the download arrived intact and matches what CI
      # produced; it is not a signature, and CODE_SIGNING.md says so plainly rather than implying
      # otherwise.
      #
      # After the signing steps on purpose: signing rewrites the file, so a checksum taken before
      # it would describe bytes nobody can download. Whichever set exists is the one hashed.
      - name: Checksums for the installers
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem -Recurse -ErrorAction SilentlyContinue signed/nsis/*.exe, signed/msi/*.msi)
          $files = if ($signed.Count) { $signed } else {
            @(Get-ChildItem -ErrorAction SilentlyContinue `
                src-tauri/target/release/bundle/nsis/*-setup.exe, src-tauri/target/release/bundle/msi/*.msi)
          }
          if (-not $files.Count) { throw 'no installers found to checksum' }
          # The name as the release page will show it, not as it is on disk here: GitHub rewrites
          # spaces in an asset name to dots, so "NOBS SQL Editor_1.3.5_x64-setup.exe" is downloaded
          # as "NOBS.SQL.Editor_1.3.5_x64-setup.exe". Listing the on-disk name leaves someone
          # checking a download unable to find their own file in the list.
          $lines = foreach ($f in $files) {
            '{0}  {1}' -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), ($f.Name -replace ' ', '.')
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          # Appended to the release notes, so the values are readable without downloading a file
          # to check a download with.
          $notes = @('', '### Verify your download', '',
                     'These installers are not code-signed. Compare what you downloaded against the SHA-256 below:',
                     '', '```') + $lines + @('```', '',
                     'PowerShell: ``Get-FileHash .\<file> -Algorithm SHA256``', '',
                     # Absolute: a release page resolves a relative link against its own URL, so
                     # CODE_SIGNING.md would land on /releases/tag/CODE_SIGNING.md and 404.
                     'See [CODE_SIGNING.md](https://github.com/monsama/nobs-sql-editor/blob/main/CODE_SIGNING.md) for what this does and does not prove.')
          $notes | Set-Content -Path release-notes-append.md -Encoding utf8
          Get-Content SHA256SUMS.txt

      # --- Publish the installers as a GitHub Release so they are publicly
      # downloadable. The Actions artifacts above expire and require a GitHub
      # login; Release assets do neither. Exactly one of the two steps below
      # runs, so a release never carries both signed and unsigned installers.
      # Releases are created as drafts - review the notes, then publish.

      - name: Publish GitHub Release (signed)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != '' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signed/nsis/**/*.exe
            signed/msi/**/*.msi
            SHA256SUMS.txt
          draft: true
          generate_release_notes: true
          append_body: true
          body_path: release-notes-append.md
          fail_on_unmatched_files: true

      - name: Publish GitHub Release (unsigned)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN == '' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
          draft: true
          generate_release_notes: true
          append_body: true
          body_path: release-notes-append.md
          fail_on_unmatched_files: true
