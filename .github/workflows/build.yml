name: build

on:
  push:
    tags: ["v*"]        # build installers on version tags
  workflow_dispatch: {} # allow manual runs

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # required to create the GitHub Release
    env:
      # The `secrets` context is not available in a step-level `if:`, so expose the
      # token as an env var here and test `env.SIGNPATH_API_TOKEN` in the signing
      # steps below. Unset secret -> empty string -> those steps are skipped.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: npm ci || npm install

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri build

      - name: Upload installers (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            **/target/release/bundle/nsis/*-setup.exe
            **/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # --- Everything below requires SignPath Foundation approval first (see CODE_SIGNING.md)
      # and three values only you can provide once approved: the SIGNPATH_API_TOKEN secret and
      # the SIGNPATH_ORGANIZATION_ID variable (both under repo Settings > Secrets and variables
      # > Actions), plus the project-slug/signing-policy-slug below (from your SignPath
      # dashboard, on your project's signing policy page). Until SIGNPATH_API_TOKEN is set,
      # every step below is skipped automatically rather than failing the build - so pushing a
      # tag before SignPath is set up still produces a normal, unsigned build, same as today.

      - name: Upload unsigned NSIS installer for signing
        id: upload-unsigned-nsis
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-nsis
          path: "**/target/release/bundle/nsis/*-setup.exe"

      - name: Sign NSIS installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'nobs-sql-editor'          # replace with your actual SignPath project slug
          signing-policy-slug: 'release-signing'   # replace with your actual SignPath signing policy slug
          github-artifact-id: '${{ steps.upload-unsigned-nsis.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed/nsis

      - name: Upload unsigned MSI installer for signing
        id: upload-unsigned-msi
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msi
          path: "**/target/release/bundle/msi/*.msi"

      - name: Sign MSI installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'nobs-sql-editor'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-msi.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed/msi

      - name: Upload signed installers
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-signed
          path: |
            signed/nsis/**
            signed/msi/**
          if-no-files-found: warn

      # --- Publish the installers as a GitHub Release so they are publicly
      # downloadable. The Actions artifacts above expire and require a GitHub
      # login; Release assets do neither. Exactly one of the two steps below
      # runs, so a release never carries both signed and unsigned installers.
      # Releases are created as drafts - review the notes, then publish.

      - name: Publish GitHub Release (signed)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed/nsis/**/*.exe
            signed/msi/**/*.msi
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish GitHub Release (unsigned)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN == '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
