[package]
name = "nobs-sql-editor"
version = "1.3.12"
edition = "2021"
description = "NOBS SQL Editor - a cross-platform MySQL/MariaDB client"
default-run = "nobs-sql-editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
mysql = { version = "28", features = ["native-tls"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
csv = "1"
hex = "0.4"
tempfile = "3"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "8"
md-5 = "0.11"
sha2 = "0.11"   # verifies the MariaDB client-tools archive against the release API's SHA-256

# Windows only: the WebView2 settings the app turns off at the source (autofill, password
# autosave). Pinned to the versions tauri itself resolves, so the interfaces reached through
# with_webview are the same ones its own controller hands back.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
